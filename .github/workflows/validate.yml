name: YON Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate YON structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run structural validator
        run: python scripts/validate_yon.py
